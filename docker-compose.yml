version: '3.8'

services:
  assignment-decoder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assignment-decoder
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - BOB_API_KEY=${BOB_API_KEY}
      - BOB_API_URL=${BOB_API_URL}
    volumes:
      - ./evidence:/app/evidence
      - ./uploads:/app/uploads
      - ./test-samples:/app/test-samples
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

